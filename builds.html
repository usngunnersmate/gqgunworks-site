<head>

<title>Builds | General Quarters Gun Works</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:black;color:white;}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 8%;
    border-bottom:1px solid rgba(255,255,255,.1);
}
.logo{height:65px;}

nav ul{
    list-style:none;
    display:flex;
    gap:35px;
}
nav a{
    color:white;
    text-decoration:none;
    letter-spacing:1px;
}
nav a:hover{opacity:.7;}

.wrapper{
    max-width:1100px;
    margin:auto;
    padding:60px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
    letter-spacing:3px;
}

/* GALLERY GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
    gap:25px;
}

.card{
    border:1px solid rgba(255,255,255,.15);
    padding:12px;
    transition:.25s;
}
.card:hover{
    transform:scale(1.02);
    border-color:white;
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
    background:#111;
}

.caption{
    padding:12px 5px 5px;
    font-size:14px;
    opacity:.8;
}

footer{
    text-align:center;
    padding:40px 20px;
    font-size:13px;
    opacity:.6;
}
</style>
</head>

<body>

<nav>
    <img src="logo.jpg" class="logo">
    <ul>

</nav>

        <div class="caption">Duty Rifle Build</div>
    </div>

    <div class="card">
        <img src="build2.jpg">
        <div class="caption">Precision Carbine</div>
    </div>

    <div class="card">
        <img src="build3.jpg">
        <div class="caption">Custom Job</div>
    </div>

</div>

</div>
